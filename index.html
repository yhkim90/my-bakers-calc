<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="베이커스 계산기">
    <meta name="theme-color" content="#8B4513">
    <title>베이커스 퍼센트 계산기</title>
    <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --primary: #8B4513;
    --primary-light: #A0522D;
    --accent: #D2691E;
    --background: #FFF8F0;
    --card-bg: #FFFFFF;
    --text: #3D2914;
    --text-light: #8B7355;
    --border: #E8DDD4;
    --danger: #e74c3c;
    --topping: #9b59b6;
    --filling: #3498db;
    --shadow: 0 2px 8px rgba(139, 69, 19, 0.1);
}
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--background);
    color: var(--text);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
    padding-top: env(safe-area-inset-top);
    padding-bottom: calc(70px + env(safe-area-inset-bottom));
}
.app-container { max-width: 480px; margin: 0 auto; padding: 0 16px; }
@media (min-width: 600px) and (orientation: portrait) {
    .app-container { max-width: 100%; padding: 0 24px; }
}
header { text-align: center; padding: 16px 0 12px; background: var(--background); }
header h1 { font-size: 1.4rem; color: var(--primary); font-weight: 700; }
main { display: flex; flex-direction: column; gap: 12px; padding-bottom: 20px; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.card { background: var(--card-bg); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
.card h2 { font-size: 0.9rem; color: var(--primary); margin-bottom: 12px; font-weight: 600; }
.select-row { display: flex; gap: 10px; margin-bottom: 12px; }
.select-group { flex: 1; }
.select-group label { display: block; font-size: 0.75rem; color: var(--text-light); margin-bottom: 6px; }
.select-wrapper {
    position: relative;
    background: var(--background);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
}
.select-wrapper select {
    width: 100%;
    height: 44px;
    padding: 0 32px 0 12px;
    border: none;
    background: transparent;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text);
    appearance: none;
    cursor: pointer;
}
.select-wrapper select:focus { outline: none; }
.select-wrapper::after {
    content: '▼';
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.7rem;
    color: var(--text-light);
    pointer-events: none;
}
.selected-display {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: linear-gradient(135deg, #FFF8F0 0%, #FFE4C9 100%);
    border: 2px solid var(--primary);
    border-radius: 12px;
}
.selected-display .emoji { font-size: 1.8rem; }
.selected-display .info { flex: 1; }
.selected-display .name { font-weight: 600; font-size: 1rem; color: var(--primary); }
.selected-display .tags { display: flex; gap: 4px; margin-top: 2px; }
.selected-display .tag { font-size: 0.6rem; padding: 1px 6px; border-radius: 8px; color: white; }
.tag-topping { background: var(--topping); }
.tag-filling { background: var(--filling); }
.input-row { display: flex; gap: 12px; }
.input-row .input-group { flex: 1; min-width: 0; }
.input-row .stepper, .input-row .input-with-unit { width: 100%; }
.input-group { margin-bottom: 10px; }
.input-group:last-child { margin-bottom: 0; }
.input-group label { display: block; font-size: 0.8rem; color: var(--text-light); margin-bottom: 6px; }
.stepper {
    display: flex;
    align-items: center;
    background: var(--background);
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
}
.stepper-btn {
    width: 44px;
    height: 44px;
    border: none;
    background: var(--card-bg);
    font-size: 1.3rem;
    color: var(--primary);
    cursor: pointer;
}
.stepper input {
    flex: 1;
    height: 44px;
    border: none;
    background: var(--background);
    text-align: center;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text);
    min-width: 0;
}
.stepper input:focus { outline: none; }
.input-with-unit {
    display: flex;
    align-items: center;
    background: var(--background);
    border-radius: 10px;
    border: 1px solid var(--border);
    overflow: hidden;
}
.input-with-unit input {
    flex: 1;
    height: 44px;
    border: none;
    background: transparent;
    padding: 0 12px;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text);
    min-width: 0;
}
.input-with-unit input:focus { outline: none; }
.input-with-unit .unit { padding: 0 12px; font-size: 0.9rem; color: var(--text-light); }
.hint { font-size: 0.75rem; color: var(--text-light); margin-top: 4px; }
.result-card {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: white;
    padding: 14px;
}
.result-card h2 { color: white; margin-bottom: 10px; }
.product-info {
    display: flex;
    justify-content: space-between;
    padding: 8px 12px;
    background: rgba(255,255,255,0.15);
    border-radius: 8px;
    margin-bottom: 12px;
    font-weight: 600;
    font-size: 0.9rem;
}
.result-section { margin-bottom: 12px; }
.section-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    padding: 0 4px;
}
.section-title { font-size: 0.75rem; opacity: 0.9; }
.badge { padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; }
.badge-dough { background: rgba(255,255,255,0.3); }
.badge-topping { background: #9b59b6; }
.badge-filling { background: #3498db; }
.section-subtotal { font-size: 0.8rem; font-weight: 600; opacity: 0.9; }
.result-table {
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow: hidden;
}
.result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    background: rgba(255,255,255,0.08);
}
.result-row:nth-child(odd) { background: rgba(255,255,255,0.12); }
.result-row .ingredient { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; }
.result-row .percent { font-size: 0.7rem; opacity: 0.7; margin-left: 3px; }
.result-row .amount { font-size: 0.95rem; font-weight: 700; }
.result-row.flour-row { background: rgba(255,255,255,0.25); }
.total-weight {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.2);
    font-size: 1rem;
    font-weight: 700;
}
.tab-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card-bg);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: center;
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 100;
}
.tab-bar-inner { display: flex; width: 100%; max-width: 600px; }
.tab-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 0;
    border: none;
    background: none;
    color: var(--text-light);
    font-size: 0.7rem;
    cursor: pointer;
}
.tab-btn .icon { font-size: 1.4rem; margin-bottom: 2px; }
.tab-btn.active { color: var(--primary); }
.recipe-list { display: flex; flex-direction: column; gap: 8px; }
.recipe-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    background: var(--background);
    border-radius: 12px;
    cursor: pointer;
}
.recipe-item:active { background: var(--border); }
.recipe-info { display: flex; align-items: center; gap: 10px; }
.recipe-info .emoji { font-size: 1.5rem; }
.recipe-info .name { font-weight: 600; font-size: 0.95rem; }
.recipe-info .category { font-size: 0.7rem; color: var(--text-light); }
.recipe-info .tags { display: flex; gap: 4px; margin-top: 2px; }
.recipe-info .tag { font-size: 0.6rem; padding: 1px 6px; border-radius: 8px; color: white; }
.recipe-arrow { color: var(--text-light); font-size: 1.2rem; }
.add-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px;
    border: 2px dashed var(--border);
    border-radius: 12px;
    background: none;
    color: var(--primary);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
}
.modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s;
}
.modal-overlay.show { opacity: 1; visibility: visible; }
.modal {
    background: var(--card-bg);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.3s;
}
.modal-overlay.show .modal { transform: translateY(0); }
.modal-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    background: var(--card-bg);
    border-radius: 20px 20px 0 0;
}
.modal-header h3 { font-size: 1.05rem; color: var(--primary); }
.modal-close { background: none; border: none; font-size: 1.4rem; color: var(--text-light); cursor: pointer; }
.modal-body { padding: 16px; }
.modal-footer {
    padding: 12px 16px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
}
.modal-footer button {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
}
.btn-primary { background: var(--primary); color: white; }
.btn-secondary { background: var(--background); color: var(--text); }
.btn-danger { background: var(--danger); color: white; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 0.8rem; color: var(--text-light); margin-bottom: 5px; }
.form-group input, .form-group select {
    width: 100%;
    height: 40px;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 12px;
    font-size: 1rem;
    background: var(--background);
}
.form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary); }
.form-row { display: flex; gap: 10px; }
.form-row .form-group { flex: 1; }
.emoji-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.emoji-picker button {
    width: 34px;
    height: 34px;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: var(--card-bg);
    font-size: 1.1rem;
    cursor: pointer;
}
.emoji-picker button.selected { border-color: var(--primary); background: var(--background); }
.section-divider {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 14px 0 10px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
}
.section-divider h4 { font-size: 0.85rem; color: var(--primary); }
.section-divider .tag { font-size: 0.65rem; padding: 2px 8px; border-radius: 10px; color: white; }
.toggle-btn {
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 15px;
    background: var(--card-bg);
    font-size: 0.7rem;
    color: var(--text-light);
    cursor: pointer;
}
.toggle-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
.ingredient-list { display: flex; flex-direction: column; gap: 6px; }
.ingredient-row { display: flex; align-items: center; gap: 6px; }
.ingredient-row span:first-child { width: 75px; font-size: 0.8rem; }
.ingredient-row input {
    flex: 1;
    height: 34px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 8px;
    font-size: 0.9rem;
    text-align: right;
    background: var(--background);
}
.ingredient-row .unit { width: 18px; font-size: 0.75rem; color: var(--text-light); }
.hidden { display: none !important; }
.mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.mode-tab {
    flex: 1;
    padding: 10px 12px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: var(--card-bg);
    color: var(--text-light);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}
.mode-tab.active {
    border-color: var(--primary);
    background: var(--primary);
    color: white;
}
.mode-content { margin-top: 12px; }
.mode-content.hidden { display: none; }
.category-list { display: flex; flex-wrap: wrap; gap: 8px; }
.category-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--background);
    border-radius: 20px;
    font-size: 0.85rem;
    cursor: pointer;
}
.category-item:active { background: var(--border); }
.category-item .cat-name { font-weight: 500; }
.category-item .cat-count { font-size: 0.75rem; color: var(--text-light); }
.category-item .cat-edit { color: var(--primary); font-size: 0.8rem; }
::-webkit-scrollbar { display: none; }
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
input[type="number"] { -moz-appearance: textfield; }
@media (min-width: 768px) and (orientation: landscape) {
    .app-container { max-width: 100%; padding: 0 32px; }
    header h1 { font-size: 2rem; }
    #calcTab.active { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
    .left-column { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
    #calcTab .card { padding: 24px; border-radius: 20px; min-width: 0; }
    #calcTab .card h2 { font-size: 1.1rem; margin-bottom: 16px; }
    #calcTab .result-card { padding: 24px; min-width: 0; }
    .result-row .ingredient { flex-wrap: nowrap; white-space: nowrap; }
    .result-row .ingredient span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; }
    .select-row { gap: 16px; }
    .select-group label { font-size: 0.9rem; margin-bottom: 8px; }
    .select-wrapper select { height: 52px; font-size: 1.1rem; padding: 0 40px 0 16px; }
    .select-wrapper::after { right: 16px; font-size: 0.8rem; }
    .selected-display { padding: 14px 18px; }
    .selected-display .emoji { font-size: 2.2rem; }
    .selected-display .name { font-size: 1.2rem; }
    .input-group label { font-size: 0.95rem; margin-bottom: 10px; }
    .stepper-btn { width: 56px; height: 52px; font-size: 1.6rem; }
    .stepper input { height: 52px; font-size: 1.4rem; }
    .input-with-unit input { height: 52px; font-size: 1.4rem; }
    .input-with-unit .unit { font-size: 1.1rem; }
    .hint { font-size: 0.9rem; }
    .result-card h2 { font-size: 1.2rem; }
    .product-info { padding: 14px 18px; font-size: 1.1rem; }
    .result-row { padding: 14px 18px; }
    .result-row .ingredient { font-size: 1rem; }
    .result-row .amount { font-size: 1.2rem; }
    .total-weight { font-size: 1.3rem; }
    #recipeTab .card { padding: 24px; max-width: 700px; margin: 0 auto; }
    .recipe-item { padding: 18px 20px; }
    .recipe-info .emoji { font-size: 2rem; }
    .recipe-info .name { font-size: 1.15rem; }
    .tab-btn { padding: 14px 0; font-size: 0.85rem; }
    .tab-btn .icon { font-size: 1.8rem; }
    .modal { max-width: 600px; border-radius: 20px; max-height: 85vh; }
    .modal-overlay { align-items: center; }
    .modal-header { padding: 20px 24px; }
    .modal-body { padding: 24px; }
}
@media (min-width: 1024px) and (orientation: landscape) {
    .app-container { padding: 0 48px; }
    #calcTab.active { gap: 32px; }
    #recipeTab .card { max-width: 800px; }
}
@media (prefers-color-scheme: dark) {
    :root {
        --background: #1A1412;
        --card-bg: #2D2420;
        --text: #F5E6D8;
        --text-light: #A89888;
        --border: #3D3530;
    }
    .selected-display { background: linear-gradient(135deg, #3D3530 0%, #4D4540 100%); }
    .stepper-btn, .tab-bar, .modal, .modal-header { background: var(--card-bg); }
}
    </style>
</head>
<body>
    <div class="app-container">
        <header><h1>🥖 베이커스 계산기</h1></header>
        <main>
            <div id="calcTab" class="tab-content active">
                <div class="left-column">
                    <div class="card">
                        <h2>제품 선택</h2>
                        <div class="select-row">
                            <div class="select-group">
                                <label>제품군</label>
                                <div class="select-wrapper"><select id="categorySelect"></select></div>
                            </div>
                            <div class="select-group">
                                <label>제품명</label>
                                <div class="select-wrapper"><select id="productSelect"></select></div>
                            </div>
                        </div>
                        <div class="selected-display" id="selectedDisplay">
                            <span class="emoji">🍞</span>
                            <div class="info"><div class="name">식빵</div><div class="tags"></div></div>
                        </div>
                    </div>
                    <div class="card">
                        <h2>계산 모드</h2>
                        <div class="mode-tabs">
                            <button class="mode-tab active" data-mode="toIngredient">분할 → 재료</button>
                            <button class="mode-tab" data-mode="toCount">재료 → 분할</button>
                        </div>
                        <div id="mode1" class="mode-content">
                            <div class="input-row">
                                <div class="input-group">
                                    <label>덩어리 수</label>
                                    <div class="stepper">
                                        <button class="stepper-btn" id="qtyMinus">−</button>
                                        <input type="number" id="qty" value="1" min="1" max="99" inputmode="numeric">
                                        <button class="stepper-btn" id="qtyPlus">+</button>
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label>분할 중량</label>
                                    <div class="input-with-unit">
                                        <input type="number" id="divWeight" value="450" min="1" inputmode="numeric">
                                        <span class="unit">g</span>
                                    </div>
                                </div>
                            </div>
                            <p class="hint" id="hint1">반죽 총량: 450g</p>
                        </div>
                        <div id="mode2" class="mode-content hidden">
                            <div class="input-group" style="margin-bottom:12px;">
                                <label>강력분 양</label>
                                <div class="input-with-unit">
                                    <input type="number" id="flourInput" value="500" min="1" inputmode="numeric">
                                    <span class="unit">g</span>
                                </div>
                            </div>
                            <div class="input-group">
                                <label>분할 중량 (덩어리당)</label>
                                <div class="input-with-unit">
                                    <input type="number" id="divWeight2" value="450" min="1" inputmode="numeric">
                                    <span class="unit">g</span>
                                </div>
                            </div>
                            <p class="hint" id="hint2">→ <strong id="countResult">1.1</strong>덩어리 가능</p>
                        </div>
                    </div>
                </div>
                <div class="card result-card">
                    <h2>📊 계산 결과</h2>
                    <div class="product-info">
                        <span id="resultName">🍞 식빵</span>
                        <span id="resultQty">1덩어리</span>
                    </div>
                    <div id="resultContent"></div>
                    <div class="total-weight">
                        <span>총 무게</span>
                        <span id="totalWeight">0g</span>
                    </div>
                </div>
            </div>
            <div id="recipeTab" class="tab-content">
                <div class="card">
                    <h2>제품군 관리</h2>
                    <div class="category-list" id="categoryList"></div>
                    <button class="add-btn" id="addCatBtn">➕ 새 제품군 추가</button>
                </div>
                <div class="card">
                    <h2>내 레시피</h2>
                    <div class="recipe-list" id="recipeList"></div>
                    <button class="add-btn" id="addBtn">➕ 새 레시피 추가</button>
                </div>
            </div>
        </main>
    </div>
    <nav class="tab-bar">
        <div class="tab-bar-inner">
            <button class="tab-btn active" data-tab="calcTab"><span class="icon">📊</span><span>계산</span></button>
            <button class="tab-btn" data-tab="recipeTab"><span class="icon">📝</span><span>레시피</span></button>
        </div>
    </nav>
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">레시피 편집</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn-secondary" id="modalCancel">취소</button>
                <button class="btn-danger hidden" id="modalDelete">삭제</button>
                <button class="btn-primary" id="modalSave">저장</button>
            </div>
        </div>
    </div>
<script>
const defaultCategories = ['식빵류','하드빵류','페이스트리','도우류','과자빵류'];
function loadCategories(){const saved=localStorage.getItem('bakerCats');return saved?JSON.parse(saved):[...defaultCategories];}
function saveCategories(cats){localStorage.setItem('bakerCats',JSON.stringify(cats));}
let customCategories=loadCategories();
const defaultRecipes={
    bread:{name:'식빵',emoji:'🍞',category:'식빵류',isDefault:true,dough:{flour:100,water:62,salt:2,yeast:1.2,sugar:8,butter:8,milk:10}},
    baguette:{name:'바게트',emoji:'🥖',category:'하드빵류',isDefault:true,dough:{flour:100,water:68,salt:2,yeast:0.8}},
    ciabatta:{name:'치아바타',emoji:'🫓',category:'하드빵류',isDefault:true,dough:{flour:100,water:75,salt:2.2,yeast:0.7,olive:3}},
    focaccia:{name:'포카치아',emoji:'🫓',category:'하드빵류',isDefault:true,dough:{flour:100,water:70,salt:2,yeast:1,olive:8,sugar:1}},
    croissant:{name:'크루아상',emoji:'🥐',category:'페이스트리',isDefault:true,dough:{flour:100,water:28,milk:28,salt:2,yeast:3,sugar:12,butter:10},topping:{foldButter:50}},
    pizza:{name:'피자도우',emoji:'🍕',category:'도우류',isDefault:true,dough:{flour:100,water:65,salt:2.5,yeast:0.5,olive:3,sugar:1}},
    bagel:{name:'베이글',emoji:'🥯',category:'도우류',isDefault:true,dough:{flour:100,water:52,salt:2,yeast:1,sugar:3,malt:2}},
    mocha:{name:'모카빵',emoji:'🧁',category:'과자빵류',isDefault:true,dough:{flour:100,water:45,milk:15,salt:1.5,yeast:2,sugar:15,butter:15,egg:10},topping:{tpButter:30,tpSugar:30,tpFlour:30,coffee:3}},
    streusel:{name:'소보로빵',emoji:'🍪',category:'과자빵류',isDefault:true,dough:{flour:100,water:40,milk:15,salt:1.5,yeast:2,sugar:18,butter:12,egg:10},topping:{tpButter:25,tpSugar:25,tpFlour:35,egg:5}},
    cream:{name:'크림빵',emoji:'🥧',category:'과자빵류',isDefault:true,dough:{flour:100,water:35,milk:20,salt:1.5,yeast:2,sugar:18,butter:15,egg:12},filling:{flMilk:100,flSugar:25,flEgg:20,flFlour:8,flButter:5,vanilla:1}},
    redbean:{name:'단팥빵',emoji:'🫘',category:'과자빵류',isDefault:true,dough:{flour:100,water:40,milk:15,salt:1.5,yeast:2,sugar:15,butter:12,egg:8},filling:{redbean:60}}
};
const N={flour:'강력분',water:'물',salt:'소금',yeast:'이스트',sugar:'설탕',butter:'버터',milk:'우유',egg:'계란',olive:'올리브오일',malt:'몰트시럽',foldButter:'접기버터',tpButter:'버터',tpSugar:'설탕',tpFlour:'박력분',coffee:'커피가루',flMilk:'우유',flSugar:'설탕',flEgg:'노른자',flFlour:'박력분',flButter:'버터',vanilla:'바닐라',redbean:'팥앙금'};
const E={flour:'🌾',water:'💧',salt:'🧂',yeast:'🫧',sugar:'🍬',butter:'🧈',milk:'🥛',egg:'🥚',olive:'🫒',malt:'🍯',foldButter:'🧈',tpButter:'🧈',tpSugar:'🍬',tpFlour:'🌾',coffee:'☕',flMilk:'🥛',flSugar:'🍬',flEgg:'🥚',flFlour:'🌾',flButter:'🧈',vanilla:'🌸',redbean:'🫘'};
const doughKeys=['flour','water','salt','yeast','sugar','butter','milk','egg','olive','malt'];
const topKeys=['tpButter','tpSugar','tpFlour','coffee','foldButter','egg'];
const fillKeys=['flMilk','flSugar','flEgg','flFlour','flButter','vanilla','redbean'];
let recipes={},state={sel:'bread',cat:'식빵류',qty:1,divWeight:450,flourInput:500,divWeight2:450,mode:'toIngredient'},editId=null;
const $=id=>document.getElementById(id);
function load(){const s=localStorage.getItem('bakerV4');if(s){recipes=JSON.parse(s);for(const[k,v]of Object.entries(defaultRecipes))if(!recipes[k])recipes[k]=JSON.parse(JSON.stringify(v));}else{recipes=JSON.parse(JSON.stringify(defaultRecipes));}save();}
function save(){localStorage.setItem('bakerV4',JSON.stringify(recipes));}
function getCategories(){const cats={};customCategories.forEach(c=>cats[c]=[]);for(const[id,r]of Object.entries(recipes)){const cat=r.category||'기타';if(!cats[cat])cats[cat]=[];cats[cat].push(id);}return cats;}
function renderCategoryList(){const cats=getCategories();const list=$('categoryList');list.innerHTML='';customCategories.forEach(cat=>{const count=cats[cat]?cats[cat].length:0;list.innerHTML+=`<div class="category-item" data-cat="${cat}"><span class="cat-name">${cat}</span><span class="cat-count">(${count})</span><span class="cat-edit">✏️</span></div>`;});}
function renderCategorySelect(){const sel=$('categorySelect');const cats=getCategories();sel.innerHTML=Object.keys(cats).filter(c=>cats[c].length>0).map(c=>`<option value="${c}" ${c===state.cat?'selected':''}>${c}</option>`).join('');}
function renderProductSelect(){const sel=$('productSelect');const cats=getCategories();const products=cats[state.cat]||[];sel.innerHTML=products.map(id=>{const r=recipes[id];return r?`<option value="${id}" ${id===state.sel?'selected':''}>${r.emoji} ${r.name}</option>`:'';}).join('');if(products.length&&!products.includes(state.sel)){state.sel=products[0];sel.value=state.sel;}}
function updateSelectedDisplay(){const r=recipes[state.sel];if(!r)return;const d=$('selectedDisplay');const hasT=r.topping&&Object.keys(r.topping).length;const hasF=r.filling&&Object.keys(r.filling).length;const tags=`${hasT?'<span class="tag tag-topping">토핑</span>':''}${hasF?'<span class="tag tag-filling">필링</span>':''}`;d.innerHTML=`<span class="emoji">${r.emoji}</span><div class="info"><div class="name">${r.name}</div><div class="tags">${tags}</div></div>`;}
function renderRecipeList(){const l=$('recipeList');l.innerHTML='';for(const[id,r]of Object.entries(recipes)){const hasT=r.topping&&Object.keys(r.topping).length;const hasF=r.filling&&Object.keys(r.filling).length;const tags=`${hasT?'<span class="tag tag-topping">토핑</span>':''}${hasF?'<span class="tag tag-filling">필링</span>':''}`;l.innerHTML+=`<div class="recipe-item" data-id="${id}"><div class="recipe-info"><span class="emoji">${r.emoji}</span><div><div class="name">${r.name}</div><div class="category">${r.category||''}</div><div class="tags">${tags}</div></div></div><span class="recipe-arrow">›</span></div>`;}}
function init(){load();renderCategoryList();renderCategorySelect();renderProductSelect();updateSelectedDisplay();renderRecipeList();bindEvents();calc();}
function bindEvents(){$('categorySelect').onchange=e=>{state.cat=e.target.value;renderProductSelect();updateSelectedDisplay();calc();};$('productSelect').onchange=e=>{state.sel=e.target.value;updateSelectedDisplay();calc();};$('recipeList').onclick=e=>{const i=e.target.closest('.recipe-item');if(i)openModal(i.dataset.id);};$('addBtn').onclick=()=>openModal(null);$('addCatBtn').onclick=()=>{const name=prompt('새 제품군 이름을 입력하세요:');if(name&&name.trim()){const trimmed=name.trim();if(customCategories.includes(trimmed)){alert('이미 존재하는 제품군입니다.');return;}customCategories.push(trimmed);saveCategories(customCategories);renderCategoryList();renderCategorySelect();}};$('categoryList').onclick=(e)=>{const item=e.target.closest('.category-item');if(!item)return;const cat=item.dataset.cat;const action=prompt(`[${cat}]\n\n1: 이름 변경\n2: 삭제\n\n번호를 입력하세요:`,'1');if(action==='1'){const newName=prompt('새 이름을 입력하세요:',cat);if(newName&&newName.trim()&&newName.trim()!==cat){const trimmed=newName.trim();if(customCategories.includes(trimmed)){alert('이미 존재하는 제품군입니다.');return;}const idx=customCategories.indexOf(cat);if(idx>-1)customCategories[idx]=trimmed;for(const r of Object.values(recipes)){if(r.category===cat)r.category=trimmed;}saveCategories(customCategories);save();renderCategoryList();renderCategorySelect();renderProductSelect();}}else if(action==='2'){const cats=getCategories();const count=cats[cat]?cats[cat].length:0;if(count>0){const move=confirm(`이 제품군에 ${count}개의 레시피가 있습니다.\n삭제하면 레시피들이 첫 번째 제품군으로 이동합니다.\n계속하시겠습니까?`);if(!move)return;const firstCat=customCategories.find(c=>c!==cat)||'기타';for(const r of Object.values(recipes)){if(r.category===cat)r.category=firstCat;}save();}const idx=customCategories.indexOf(cat);if(idx>-1)customCategories.splice(idx,1);if(customCategories.length===0)customCategories.push('기타');saveCategories(customCategories);renderCategoryList();renderCategorySelect();renderProductSelect();}};document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active');if(b.dataset.tab==='recipeTab'){renderCategoryList();renderRecipeList();}});document.querySelectorAll('.mode-tab').forEach(tab=>{tab.onclick=()=>{document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');state.mode=tab.dataset.mode;$('mode1').classList.toggle('hidden',state.mode!=='toIngredient');$('mode2').classList.toggle('hidden',state.mode!=='toCount');calc();};});$('qtyMinus').onclick=()=>{if(state.qty>1){state.qty--;$('qty').value=state.qty;hint();calc();}};$('qtyPlus').onclick=()=>{if(state.qty<99){state.qty++;$('qty').value=state.qty;hint();calc();}};$('qty').oninput=e=>{state.qty=Math.max(1,Math.min(99,parseInt(e.target.value)||1));hint();calc();};$('divWeight').oninput=e=>{state.divWeight=parseInt(e.target.value)||0;hint();calc();};$('flourInput').oninput=e=>{state.flourInput=parseInt(e.target.value)||0;calcMode2();};$('divWeight2').oninput=e=>{state.divWeight2=parseInt(e.target.value)||0;calcMode2();};$('modalClose').onclick=closeModal;$('modalCancel').onclick=closeModal;$('modalSave').onclick=saveModal;$('modalDelete').onclick=delRecipe;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal();};}
function hint(){const totalDough=state.qty*state.divWeight;$('hint1').textContent=`반죽 총량: ${totalDough.toLocaleString()}g`;}
function calcMode2(){const r=recipes[state.sel];if(!r)return;const f=state.flourInput;const doughPercent=Object.values(r.dough).reduce((s,p)=>s+p,0);const totalDoughWeight=f*(doughPercent/100);const count=totalDoughWeight/state.divWeight2;$('countResult').textContent=count.toFixed(1);$('resultName').textContent=`${r.emoji} ${r.name}`;$('resultQty').textContent=`강력분 ${f}g 기준`;let html='',total=0;const doughTotal=secTotal(r.dough,f);total+=doughTotal;html+=`<div class="result-section"><div class="section-header-row"><span class="section-title"><span class="badge badge-dough">반죽</span></span><span class="section-subtotal">${fmt(doughTotal)}</span></div><div class="result-table">${secHtml(r.dough,f)}</div></div>`;if(r.topping&&Object.keys(r.topping).length){const t=secTotal(r.topping,f);total+=t;html+=`<div class="result-section"><div class="section-header-row"><span class="section-title"><span class="badge badge-topping">토핑</span> <small style="opacity:0.7">(+추가)</small></span><span class="section-subtotal">+${fmt(t)}</span></div><div class="result-table">${secHtml(r.topping,f)}</div></div>`;}if(r.filling&&Object.keys(r.filling).length){const t=secTotal(r.filling,f);total+=t;html+=`<div class="result-section"><div class="section-header-row"><span class="section-title"><span class="badge badge-filling">필링</span> <small style="opacity:0.7">(+추가)</small></span><span class="section-subtotal">+${fmt(t)}</span></div><div class="result-table">${secHtml(r.filling,f)}</div></div>`;}html+=`<div class="result-section" style="background:rgba(255,255,255,0.1);border-radius:10px;padding:12px;margin-top:8px;"><div style="font-size:0.9rem;opacity:0.9;">📐 ${state.divWeight2}g 분할 시 <strong>${count.toFixed(1)}</strong>덩어리</div></div>`;$('resultContent').innerHTML=html;$('totalWeight').textContent=fmt(total);}
function calc(){if(state.mode==='toCount'){calcMode2();return;}const r=recipes[state.sel];if(!r)return;const totalDoughWeight=state.qty*state.divWeight;const doughPercent=Object.values(r.dough).reduce((s,p)=>s+p,0);const f=totalDoughWeight/(doughPercent/100);$('resultName').textContent=`${r.emoji} ${r.name}`;$('resultQty').textContent=`${state.qty}덩어리 × ${state.divWeight}g`;let html='',total=0;const doughTotal=secTotal(r.dough,f);total+=doughTotal;html+=`<div class="result-section"><div class="section-header-row"><span class="section-title"><span class="badge badge-dough">반죽</span></span><span class="section-subtotal">${fmt(doughTotal)}</span></div><div class="result-table">${secHtml(r.dough,f)}</div></div>`;if(r.topping&&Object.keys(r.topping).length){const t=secTotal(r.topping,f);total+=t;html+=`<div class="result-section"><div class="section-header-row"><span class="section-title"><span class="badge badge-topping">토핑</span> <small style="opacity:0.7">(+추가)</small></span><span class="section-subtotal">+${fmt(t)}</span></div><div class="result-table">${secHtml(r.topping,f)}</div></div>`;}if(r.filling&&Object.keys(r.filling).length){const t=secTotal(r.filling,f);total+=t;html+=`<div class="result-section"><div class="section-header-row"><span class="section-title"><span class="badge badge-filling">필링</span> <small style="opacity:0.7">(+추가)</small></span><span class="section-subtotal">+${fmt(t)}</span></div><div class="result-table">${secHtml(r.filling,f)}</div></div>`;}$('resultContent').innerHTML=html;$('totalWeight').textContent=fmt(total);}
function secHtml(ings,f){let h='';for(const[k,p]of Object.entries(ings)){if(!p)continue;const a=(f*p)/100;h+=`<div class="result-row ${k==='flour'?'flour-row':''}"><div class="ingredient"><span>${E[k]||'📦'}</span><span>${N[k]||k}</span><span class="percent">(${p}%)</span></div><div class="amount">${fmt(a)}</div></div>`;}return h;}
function secTotal(ings,f){return Object.values(ings).reduce((s,p)=>s+(f*p)/100,0);}
function fmt(n){return n>=100?Math.round(n)+'g':n>=10?n.toFixed(1).replace(/\.0$/,'')+'g':n.toFixed(1)+'g';}
function openModal(id){editId=id;const isNew=!id;const r=isNew?{name:'',emoji:'🍞',category:'내 레시피',dough:{flour:100,water:65,salt:2,yeast:1}}:recipes[id];$('modalTitle').textContent=isNew?'새 레시피 추가':'레시피 편집';$('modalDelete').classList.toggle('hidden',isNew||r.isDefault);const hasT=!!r.topping,hasF=!!r.filling;const catOptions=Object.keys(getCategories()).map(c=>`<option value="${c}" ${c===r.category?'selected':''}>${c}</option>`).join('');let html=`<div class="form-row"><div class="form-group"><label>이름</label><input type="text" id="eName" value="${r.name}"></div><div class="form-group" style="flex:0.35"><label>이모지</label><input type="text" id="eEmoji" value="${r.emoji}" maxlength="2" style="text-align:center;font-size:1.2rem;"></div></div><div class="form-group"><label>제품군</label><select id="eCategory">${catOptions}</select></div><div class="emoji-picker" id="ePicker">${['🍞','🥖','🥐','🥯','🫓','🍕','🧁','🍪','🥧','🫘','🍩','🎂'].map(e=>`<button type="button" ${e===r.emoji?'class="selected"':''}>${e}</button>`).join('')}</div><div class="section-divider"><h4>🌾 반죽</h4></div><div class="ingredient-list" id="eDough">${doughKeys.map(k=>ingRow(k,r.dough?.[k]||0,k==='flour','dough')).join('')}</div><div class="section-divider"><h4><span class="tag tag-topping">토핑</span></h4><button class="toggle-btn ${hasT?'active':''}" id="eToggleT">${hasT?'사용중':'추가'}</button></div><div class="ingredient-list ${hasT?'':'hidden'}" id="eTop">${topKeys.map(k=>ingRow(k,r.topping?.[k]||0,false,'topping')).join('')}</div><div class="section-divider"><h4><span class="tag tag-filling">필링</span></h4><button class="toggle-btn ${hasF?'active':''}" id="eToggleF">${hasF?'사용중':'추가'}</button></div><div class="ingredient-list ${hasF?'':'hidden'}" id="eFill">${fillKeys.map(k=>ingRow(k,r.filling?.[k]||0,false,'filling')).join('')}</div>`;$('modalBody').innerHTML=html;$('ePicker').onclick=e=>{if(e.target.tagName==='BUTTON'){$('eEmoji').value=e.target.textContent;document.querySelectorAll('#ePicker button').forEach(b=>b.classList.remove('selected'));e.target.classList.add('selected');}};$('eToggleT').onclick=e=>{e.target.classList.toggle('active');$('eTop').classList.toggle('hidden');e.target.textContent=e.target.classList.contains('active')?'사용중':'추가';};$('eToggleF').onclick=e=>{e.target.classList.toggle('active');$('eFill').classList.toggle('hidden');e.target.textContent=e.target.classList.contains('active')?'사용중':'추가';};$('modal').classList.add('show');}
function ingRow(k,v,ro,type){return `<div class="ingredient-row"><span>${E[k]||'📦'} ${N[k]||k}</span><input type="number" data-k="${k}" data-t="${type}" value="${v}" ${ro?'readonly style="background:#ddd;"':''} min="0" max="200" step="0.1" inputmode="decimal"><span class="unit">%</span></div>`;}
function closeModal(){$('modal').classList.remove('show');editId=null;}
function saveModal(){const name=$('eName').value.trim(),emoji=$('eEmoji').value.trim()||'🍞',category=$('eCategory').value;if(!name){alert('이름을 입력하세요');return;}const dough={flour:100},topping={},filling={};document.querySelectorAll('#modalBody input[data-k]').forEach(i=>{const k=i.dataset.k,t=i.dataset.t,v=parseFloat(i.value)||0;if(v>0||k==='flour'){if(t==='dough')dough[k]=v;else if(t==='topping')topping[k]=v;else if(t==='filling')filling[k]=v;}});const useT=$('eToggleT').classList.contains('active'),useF=$('eToggleF').classList.contains('active');const id=editId||'c_'+Date.now();const isDefault=editId?recipes[editId]?.isDefault:false;recipes[id]={name,emoji,category,dough,isDefault};if(useT&&Object.keys(topping).length)recipes[id].topping=topping;if(useF&&Object.keys(filling).length)recipes[id].filling=filling;save();renderCategorySelect();renderProductSelect();updateSelectedDisplay();renderRecipeList();if(!editId){state.cat=category;state.sel=id;renderCategorySelect();renderProductSelect();updateSelectedDisplay();}closeModal();calc();}
function delRecipe(){if(!editId||recipes[editId]?.isDefault)return;if(confirm('삭제하시겠습니까?')){delete recipes[editId];save();if(state.sel===editId)state.sel='bread';state.cat='식빵류';renderCategorySelect();renderProductSelect();updateSelectedDisplay();renderRecipeList();closeModal();calc();}}
init();
</script>
</body>
