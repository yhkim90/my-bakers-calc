<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="제빵 매뉴얼">
  <meta name="theme-color" content="#5C4033">
  <title>제빵 매뉴얼</title>
  <style>
    :root {
      --bg: #f6f1ea;
      --surface: #fffcf7;
      --text: #3d2b22;
      --muted: #8a7364;
      --accent: #5c4033;
      --line: #e6d9cc;
      --danger: #9a3b2f;
      --ok: #3d6b4f;
      --radius: 16px;
      --tap: 44px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-size: 17px;
      line-height: 1.45;
    }
    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) calc(24px + env(safe-area-inset-bottom)) env(safe-area-inset-left);
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; }
    a { color: inherit; }
    .app { width: min(430px, 100%); margin: 0 auto; padding: 8px 20px 88px; }
    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: grid; grid-template-columns: 1fr 1fr;
      padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
      background: var(--bg); border-top: 1px solid var(--line);
    }
    .tabbar button { min-height: 44px; font-weight: 700; color: var(--muted); }
    .tabbar button.on { color: var(--accent); }
    .switch {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin: 8px 0 16px; padding: 4px; border-radius: 12px; background: #efe4d8;
    }
    .switch button { min-height: 40px; border-radius: 10px; font-weight: 700; color: var(--muted); }
    .switch button.on { background: var(--surface); color: var(--accent); }
    .topbar { display: flex; align-items: center; min-height: var(--tap); gap: 8px; margin-bottom: 8px; }
    .topbar h1, .topbar h2 { flex: 1; margin: 0; font-size: 20px; font-weight: 700; text-align: center; }
    .ghost { min-width: 52px; min-height: var(--tap); color: var(--accent); font-weight: 600; }
    .lede { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
    .list { display: flex; flex-direction: column; }
    .item-link { display: block; padding: 16px 0; text-decoration: none; border-bottom: 1px solid var(--line); }
    .item-link strong { display: block; font-size: 18px; }
    .item-link span { display: block; margin-top: 4px; color: var(--muted); font-size: 14px; }
    .btn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; min-height: 52px; margin-top: 16px; border-radius: 999px; font-weight: 700;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: #efe4d8; color: var(--accent); }
    .btn-danger { color: var(--danger); }
    .stack { display: flex; flex-direction: column; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field span, .section-title { color: var(--muted); font-size: 13px; font-weight: 700; }
    .section-title { margin: 10px 0 0; }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%; min-height: var(--tap); padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
    }
    textarea { min-height: 110px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 72px 28px 40px; gap: 8px; align-items: center; }
    .row input[type="checkbox"] { width: 22px; height: 22px; justify-self: center; }
    .row.topping { grid-template-columns: 1fr 108px 72px 40px; }
    .icon-btn { width: 40px; height: 40px; border-radius: 999px; color: var(--danger); background: #f3e6df; }
    .card { padding: 14px 16px; border-radius: var(--radius); background: #efe4d8; }
    .card strong { display: block; margin-top: 4px; font-size: 22px; }
    .stepper {
      display: grid; grid-template-columns: 64px 1fr 64px; align-items: center;
      border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface);
    }
    .stepper button { min-height: 56px; font-size: 24px; color: var(--accent); }
    .stepper output { text-align: center; font-size: 28px; font-weight: 700; }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill { padding: 6px 10px; border-radius: 999px; background: #efe4d8; color: var(--accent); font-size: 13px; font-weight: 600; }
    .sheet { display: flex; flex-direction: column; }
    .sheet-row {
      display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: baseline;
      padding: 12px 0; border-bottom: 1px solid var(--line);
    }
    .sheet-row small { color: var(--muted); }
    .sheet-row b { font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); font-size: 14px; }
    .warn { color: #8a5a20; font-size: 13px; }
    .hidden { display: none; }
    .footer-actions { margin-top: 28px; display: flex; flex-direction: column; gap: 4px; }
    .footer-actions button { min-height: 40px; color: var(--muted); font-size: 14px; }
    .procedure { display: flex; flex-direction: column; gap: 10px; }
    .step-card {
      display: grid; grid-template-columns: 36px 1fr; gap: 12px; width: 100%;
      padding: 14px; border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--surface); text-align: left;
    }
    .step-card.done { opacity: 0.5; }
    .step-num {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 999px; background: var(--accent); color: #fff;
      font-size: 15px; font-weight: 700;
    }
    .step-card.done .step-num { background: var(--ok); }
    .step-body { display: flex; flex-direction: column; gap: 4px; }
    .step-body small { color: var(--muted); }
    .step-edit { padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
    .step-edit-head { display: grid; grid-template-columns: 36px 1fr 64px 40px; gap: 8px; align-items: center; margin-bottom: 8px; }
    .step-edit textarea { min-height: 72px; }
    .step-move { display: flex; gap: 12px; margin-top: 8px; }
    .step-move button { color: var(--accent); font-size: 14px; font-weight: 600; min-height: 36px; }
  </style>
</head>
<body>
  <main class="app" id="app"></main>
  <script>
(function () {
  var STORAGE_KEY = "xi-bakery-manual-v1";

  function uid() {
    return crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random();
  }

  function step(title, detail, minutes) {
    return { id: uid(), title: title, detail: detail, minutes: minutes };
  }

  function chestnutSteps() {
    return [
      step("계량", "반죽 재료와 밤, 달걀물을 각각 계량한다.", 10),
      step("반죽", "저속 후 중속으로 글루텐을 형성하고 버터를 넣어 최종 반죽한다. 반죽온도 27°C.", 15),
      step("1차 발효", "27°C 전후에서 40분. 손가락으로 눌렀을 때 가스가 천천히 빠지면 끝.", 40),
      step("분할 · 둥글리기", "450g씩 분할하고 표면이 팽팽하게 둥글리기한다.", 8),
      step("중간 발효", "마른 천을 덮고 15분. 반죽이 마르지 않게 한다.", 15),
      step("성형", "밀어서 가스를 빼고 원통으로 성형한다. 밤은 반죽에 고르게 넣는다.", 10),
      step("2차 발효", "팬 높이의 80~90%까지 40분.", 40),
      step("굽기", "달걀물을 바르고 190°C에서 25분.", 25),
      step("냉각", "틀에서 바로 꺼내 식힘망에서 식힌다.", 30)
    ];
  }

  function templateSteps() {
    return [
      step("계량", "밀가루를 100%로 두고 나머지 재료를 계량한다.", ""),
      step("반죽", "재료를 섞고 글루텐이 형성될 때까지 반죽한다.", ""),
      step("1차 발효", "반죽이 약 2배가 될 때까지 발효한다.", ""),
      step("분할 · 둥글리기", "정한 무게로 나누고 둥글리기한다.", ""),
      step("중간 발효", "성형하기 쉽게 잠시 휴지시킨다.", ""),
      step("성형", "가스를 빼고 원하는 모양으로 성형한다.", ""),
      step("2차 발효", "오븐에 넣기 직전까지 발효한다.", ""),
      step("굽기", "품목에 맞는 온도와 시간으로 굽는다.", ""),
      step("냉각", "팬에서 꺼내 식힌다.", "")
    ];
  }

  function chestnutLoaf() {
    return {
      id: "chestnut-loaf",
      name: "밤식빵",
      pieceWeight: 450,
      notes: "반죽온도 27°C · 1차발효 40분 · 중간발효 15분 · 2차발효 40분 · 190°C / 25분",
      ingredients: [
        { id: uid(), name: "강력분", pct: 100, isFlour: true },
        { id: uid(), name: "물", pct: 58, isFlour: false },
        { id: uid(), name: "설탕", pct: 12, isFlour: false },
        { id: uid(), name: "소금", pct: 1.8, isFlour: false },
        { id: uid(), name: "탈지분유", pct: 3, isFlour: false },
        { id: uid(), name: "버터", pct: 8, isFlour: false },
        { id: uid(), name: "생이스트", pct: 3, isFlour: false },
        { id: uid(), name: "계란", pct: 8, isFlour: false }
      ],
      toppings: [
        { id: uid(), name: "밤(과육)", mode: "bp", value: 30 },
        { id: uid(), name: "달걀물", mode: "piece", value: 8 }
      ],
      steps: chestnutSteps()
    };
  }

  function blankItem() {
    return {
      id: uid(),
      name: "",
      pieceWeight: 450,
      notes: "",
      ingredients: [{ id: uid(), name: "강력분", pct: 100, isFlour: true }],
      toppings: [],
      steps: templateSteps()
    };
  }

  function normalizeItem(item) {
    if (!Array.isArray(item.ingredients)) item.ingredients = [];
    if (!Array.isArray(item.toppings)) item.toppings = [];
    if (!Array.isArray(item.steps) || !item.steps.length) {
      item.steps = item.id === "chestnut-loaf" ? chestnutSteps() : [];
    }
    return item;
  }

  var memoryStore = {};

  function readStore(key) {
    try { return localStorage.getItem(key); }
    catch (e) { return Object.prototype.hasOwnProperty.call(memoryStore, key) ? memoryStore[key] : null; }
  }

  function writeStore(key, value) {
    try { localStorage.setItem(key, value); }
    catch (e) { memoryStore[key] = value; }
  }

  function cloneData(value) { return JSON.parse(JSON.stringify(value)); }

  function loadState() {
    try {
      var raw = readStore(STORAGE_KEY);
      if (!raw) return { items: [chestnutLoaf()] };
      var parsed = JSON.parse(raw);
      if (!parsed.items || !parsed.items.length) return { items: [chestnutLoaf()] };
      parsed.items = parsed.items.map(normalizeItem);
      return parsed;
    } catch (e) {
      return { items: [chestnutLoaf()] };
    }
  }

  function saveState(state) { writeStore(STORAGE_KEY, JSON.stringify(state)); }

  function doughPct(item) {
    return item.ingredients.reduce(function (sum, row) { return sum + (Number(row.pct) || 0); }, 0);
  }

  function flourPct(item) {
    return item.ingredients.filter(function (row) { return row.isFlour; })
      .reduce(function (sum, row) { return sum + (Number(row.pct) || 0); }, 0);
  }

  function scale(item, pieces) {
    var pct = doughPct(item);
    var count = Math.max(1, Number(pieces) || 1);
    var pieceWeight = Number(item.pieceWeight) || 0;
    var totalDough = pieceWeight * count;
    var flour = pct > 0 ? totalDough / (pct / 100) : 0;
    return {
      count: count,
      pieceWeight: pieceWeight,
      totalDough: totalDough,
      doughPct: pct,
      flour: flour,
      dough: item.ingredients.map(function (row) {
        return Object.assign({}, row, { g: (flour * (Number(row.pct) || 0)) / 100 });
      }),
      topping: item.toppings.map(function (row) {
        return Object.assign({}, row, {
          g: row.mode === "bp"
            ? (flour * (Number(row.value) || 0)) / 100
            : (Number(row.value) || 0) * count
        });
      })
    };
  }

  function grams(n) {
    return Number(n).toLocaleString("ko-KR", { maximumFractionDigits: 1 }) + " g";
  }

  function escapeHtml(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function parseHash() {
    var raw = location.hash.replace(/^#/, "") || "/";
    var split = raw.split("?");
    var path = split[0];
    var query = split[1] || "";
    var parts = path.split("/").filter(Boolean);
    var params = new URLSearchParams(query);
    return { parts: parts, params: params };
  }

  function go(hash) { location.hash = hash; }

  function tabBar(active) {
    return '<nav class="tabbar">' +
      '<button type="button" class="' + (active === "items" ? "on" : "") + '" data-go="/">품목</button>' +
      '<button type="button" class="' + (active === "manuals" ? "on" : "") + '" data-go="/manuals">매뉴얼</button>' +
      "</nav>";
  }

  function itemSwitch(item, which) {
    return '<div class="switch">' +
      '<button type="button" class="' + (which === "mix" ? "on" : "") + '" data-go="/item/' + item.id + '">배합</button>' +
      '<button type="button" class="' + (which === "manual" ? "on" : "") + '" data-go="/item/' + item.id + '/steps">매뉴얼</button>' +
      "</div>";
  }

  var root = document.getElementById("app");
  var state = loadState();
  saveState(state);
  var draft = null;
  var pieceCount = 2;
  var doneSteps = {};

  function findItem(id) {
    return state.items.find(function (item) { return item.id === id; });
  }

  function render() {
    var parsed = parseHash();
    var parts = parsed.parts;
    var params = parsed.params;

    if (parts[0] === "manuals") {
      draft = null;
      root.innerHTML = renderManualList() + tabBar("manuals");
      bindNav();
      return;
    }
    if (parts[0] === "new") {
      if (!draft || draft._mode !== "new") draft = Object.assign(blankItem(), { _mode: "new" });
      root.innerHTML = renderEditor(draft, true) + tabBar("items");
      bindEditor(draft, true);
      return;
    }
    if (parts[0] === "item" && parts[1]) {
      var item = findItem(parts[1]);
      if (!item) { go("/"); return; }
      if (parts[2] === "edit") {
        if (!draft || draft.id !== item.id || draft._mode !== "edit") {
          draft = Object.assign(cloneData(item), { _mode: "edit" });
        }
        root.innerHTML = renderEditor(draft, false) + tabBar("items");
        bindEditor(draft, false);
        return;
      }
      if (parts[2] === "calc") {
        pieceCount = Number(params.get("n")) || pieceCount || 2;
        root.innerHTML = renderCalc(item) + tabBar("items");
        bindCalc(item);
        return;
      }
      if (parts[2] === "result") {
        pieceCount = Number(params.get("n")) || pieceCount || 2;
        root.innerHTML = renderResult(item) + tabBar("items");
        bindNav();
        return;
      }
      if (parts[2] === "steps") {
        root.innerHTML = renderSteps(item) + tabBar("manuals");
        bindSteps(item);
        return;
      }
      draft = null;
      root.innerHTML = renderManual(item) + tabBar("items");
      bindManual(item);
      return;
    }
    draft = null;
    root.innerHTML = renderList() + tabBar("items");
    bindList();
  }

  function renderList() {
    var rows = state.items.map(function (item) {
      var topping = item.toppings.length ? " · 토핑 " + item.toppings.length + "종" : "";
      return '<a class="item-link" href="#/item/' + item.id + '">' +
        "<strong>" + escapeHtml(item.name || "이름 없는 품목") + "</strong>" +
        "<span>분할 " + escapeHtml(item.pieceWeight) + "g · 반죽합 " + doughPct(item).toFixed(1) + "%" + topping + "</span>" +
        "</a>";
    }).join("");
    return '<header class="topbar"><span></span><h1>품목</h1><span></span></header>' +
      '<p class="lede">배합과 계량. 밤식빵을 기준으로 품목을 추가하세요. 입력값은 이 휴대폰에만 저장됩니다.</p>' +
      '<div class="list">' + rows + "</div>" +
      '<button class="btn btn-primary" id="add-item">새 품목 등록</button>' +
      '<div class="footer-actions">' +
      '<button type="button" id="export-data">배합 내보내기</button>' +
      '<button type="button" id="import-data">배합 가져오기</button>' +
      '<input id="import-file" class="hidden" type="file" accept="application/json">' +
      "</div>";
  }

  function renderManualList() {
    var rows = state.items.map(function (item) {
      var n = (item.steps || []).length;
      return '<a class="item-link" href="#/item/' + item.id + '/steps">' +
        "<strong>" + escapeHtml(item.name || "이름 없는 품목") + "</strong>" +
        "<span>" + (n ? n + "단계 절차" : "절차 없음 · 눌러서 입력") + "</span></a>";
    }).join("");
    return '<header class="topbar"><span></span><h1>매뉴얼</h1><span></span></header>' +
      '<p class="lede">품목별 베이킹 절차입니다. 단계를 누르면 오늘 진행을 표시합니다.</p>' +
      '<div class="list">' + rows + "</div>";
  }

  function renderManual(item) {
    var flour = flourPct(item);
    return '<header class="topbar">' +
      '<button class="ghost" data-go="/">뒤로</button>' +
      "<h2>" + escapeHtml(item.name) + "</h2>" +
      '<button class="ghost" data-go="/item/' + item.id + '/edit">수정</button></header>' +
      itemSwitch(item, "mix") +
      '<div class="pills">' +
      '<span class="pill">분할 ' + escapeHtml(item.pieceWeight) + "g</span>" +
      '<span class="pill">반죽 ' + doughPct(item).toFixed(1) + "%</span>" +
      '<span class="pill">밀가루 ' + flour.toFixed(1) + "%</span></div>" +
      '<div class="card" style="margin-top:16px"><span class="muted">공정 메모</span>' +
      "<div>" + escapeHtml(item.notes || "메모가 없습니다.") + "</div></div>" +
      '<button class="btn btn-primary" data-go="/item/' + item.id + '/calc">오늘 분량 계산</button>' +
      '<button class="btn btn-secondary" id="duplicate">이 품목 복제</button>' +
      '<button class="btn btn-danger" id="delete-item">품목 삭제</button>';
  }

  function ingredientRow(row) {
    return '<div class="row" data-id="' + row.id + '">' +
      '<input type="text" data-k="name" value="' + escapeHtml(row.name) + '" placeholder="재료명">' +
      '<input type="number" inputmode="decimal" data-k="pct" value="' + row.pct + '" step="0.1" placeholder="%">' +
      '<input type="checkbox" data-k="flour" title="밀가루 기준"' + (row.isFlour ? " checked" : "") + ">" +
      '<button type="button" class="icon-btn" data-remove="ingredient" aria-label="재료 삭제">×</button></div>';
  }

  function toppingRow(row) {
    return '<div class="row topping" data-id="' + row.id + '">' +
      '<input type="text" data-k="name" value="' + escapeHtml(row.name) + '" placeholder="토핑명">' +
      '<select data-k="mode">' +
      '<option value="bp"' + (row.mode === "bp" ? " selected" : "") + ">밀가루 %</option>" +
      '<option value="piece"' + (row.mode === "piece" ? " selected" : "") + ">개당 g</option>" +
      "</select>" +
      '<input type="number" inputmode="decimal" data-k="value" value="' + row.value + '" step="0.1">' +
      '<button type="button" class="icon-btn" data-remove="topping" aria-label="토핑 삭제">×</button></div>';
  }

  function stepEditRow(row, index) {
    return '<div class="step-edit" data-id="' + row.id + '">' +
      '<div class="step-edit-head"><span class="step-num">' + (index + 1) + "</span>" +
      '<input type="text" data-k="title" value="' + escapeHtml(row.title) + '" placeholder="단계 이름">' +
      '<input type="number" inputmode="numeric" data-k="minutes" value="' + escapeHtml(row.minutes) + '" placeholder="분" min="0">' +
      '<button type="button" class="icon-btn" data-remove="step" aria-label="단계 삭제">×</button></div>' +
      '<textarea data-k="detail" placeholder="간단한 작업 요령">' + escapeHtml(row.detail) + "</textarea>" +
      '<div class="step-move"><button type="button" data-move="-1">위로</button>' +
      '<button type="button" data-move="1">아래로</button></div></div>';
  }

  function renderSteps(item) {
    var done = doneSteps[item.id] || {};
    var steps = item.steps || [];
    if (!steps.length) {
      return '<header class="topbar"><button class="ghost" data-go="/manuals">뒤로</button>' +
        "<h2>" + escapeHtml(item.name) + "</h2><span></span></header>" +
        itemSwitch(item, "manual") +
        '<p class="lede">아직 절차가 없습니다. 수정 화면에서 단계를 추가하세요.</p>' +
        '<button class="btn btn-primary" data-go="/item/' + item.id + '/edit">절차 입력하기</button>';
    }
    var cards = steps.map(function (row, index) {
      return '<button type="button" class="step-card' + (done[row.id] ? " done" : "") + '" data-step="' + row.id + '">' +
        '<span class="step-num">' + (index + 1) + "</span>" +
        '<span class="step-body"><strong>' + escapeHtml(row.title) + "</strong>" +
        (row.minutes ? "<small>" + escapeHtml(row.minutes) + "분</small>" : "") +
        "<span>" + escapeHtml(row.detail) + "</span></span></button>";
    }).join("");
    return '<header class="topbar"><button class="ghost" data-go="/manuals">뒤로</button>' +
      "<h2>" + escapeHtml(item.name) + "</h2><span></span></header>" +
      itemSwitch(item, "manual") +
      '<p class="lede">' + escapeHtml(item.name) + " · 끝난 단계는 누르면 표시됩니다.</p>" +
      '<div class="procedure">' + cards + "</div>" +
      '<button class="btn btn-secondary" id="reset-steps">처음부터</button>' +
      '<button class="btn btn-secondary" data-go="/item/' + item.id + '/edit">절차 수정</button>';
  }

  function renderEditor(item, isNew) {
    var flour = flourPct(item);
    var warn = Math.abs(flour - 100) > 0.05
      ? '<p class="warn">밀가루로 표시된 재료 합이 ' + flour.toFixed(1) + "%입니다. 보통 100%가 기준입니다.</p>"
      : "";
    return '<header class="topbar">' +
      '<button class="ghost" data-go="' + (isNew ? "/" : "/item/" + item.id) + '">뒤로</button>' +
      "<h2>" + (isNew ? "품목 등록" : "품목 수정") + "</h2><span></span></header>" +
      '<form id="edit-form" class="stack">' +
      '<label class="field"><span>품목명</span>' +
      '<input name="name" type="text" value="' + escapeHtml(item.name) + '" placeholder="예: 단팥빵" required></label>' +
      '<label class="field"><span>발효 후 1덩어리 무게 (g)</span>' +
      '<input name="pieceWeight" type="number" inputmode="decimal" value="' + item.pieceWeight + '" step="1" min="1" required></label>' +
      '<label class="field"><span>공정 메모</span>' +
      '<textarea name="notes" placeholder="반죽온도, 발효, 굽기">' + escapeHtml(item.notes) + "</textarea></label>" +
      '<p class="section-title">반죽 재료 · 베이커스 % · 체크는 밀가루</p>' +
      '<div id="ingredient-list">' + item.ingredients.map(ingredientRow).join("") + "</div>" +
      '<button type="button" class="btn btn-secondary" id="add-ingredient">재료 추가</button>' + warn +
      '<p class="section-title">토핑 · 속재료</p>' +
      '<div id="topping-list">' + item.toppings.map(toppingRow).join("") + "</div>" +
      '<button type="button" class="btn btn-secondary" id="add-topping">토핑 추가</button>' +
      '<p class="section-title">베이킹 절차</p>' +
      '<div id="step-list">' + (item.steps || []).map(stepEditRow).join("") + "</div>" +
      '<button type="button" class="btn btn-secondary" id="add-step">단계 추가</button>' +
      '<button type="submit" class="btn btn-primary">저장</button></form>';
  }

  function renderCalc(item) {
    var total = (Number(item.pieceWeight) || 0) * pieceCount;
    return '<header class="topbar"><button class="ghost" data-go="/item/' + item.id + '">뒤로</button>' +
      "<h2>분량 입력</h2><span></span></header>" +
      '<p class="lede" style="text-align:center;font-size:28px;font-weight:700;color:var(--text)">' + escapeHtml(item.name) + "</p>" +
      '<div class="card"><span class="muted">발효 후 1덩어리</span><strong>' + grams(item.pieceWeight) + "</strong></div>" +
      '<p class="section-title">몇 덩어리를 만들까요?</p>' +
      '<div class="stepper"><button type="button" id="minus" aria-label="줄이기">−</button>' +
      '<output id="count">' + pieceCount + "</output>" +
      '<button type="button" id="plus" aria-label="늘리기">+</button></div>' +
      '<div class="card"><span class="muted">목표 반죽 총량</span><strong id="total">' + grams(total) + "</strong></div>" +
      '<button class="btn btn-primary" id="to-result">계량표 보기</button>';
  }

  function renderResult(item) {
    var result = scale(item, pieceCount);
    var doughRows = result.dough.map(function (row) {
      return '<div class="sheet-row"><span>' + escapeHtml(row.name) + "</span><small>" + row.pct +
        "%</small><b>" + grams(row.g) + "</b></div>";
    }).join("");
    var toppingRows = result.topping.map(function (row) {
      var basis = row.mode === "bp" ? "밀가루 " + row.value + "%" : "개당 " + row.value + "g";
      return '<div class="sheet-row"><span>' + escapeHtml(row.name) + "</span><small>" + basis +
        "</small><b>" + grams(row.g) + "</b></div>";
    }).join("");
    return '<header class="topbar"><button class="ghost" data-go="/item/' + item.id + "/calc?n=" + result.count +
      '">뒤로</button><h2>계량표</h2><span></span></header>' +
      '<p class="lede">' + result.count + "덩어리 · 덩어리당 " + grams(result.pieceWeight) +
      " · 밀가루 " + grams(result.flour) + "</p>" +
      '<p class="section-title">반죽</p><div class="sheet">' + doughRows + "</div>" +
      (result.topping.length ? '<p class="section-title">토핑</p><div class="sheet">' + toppingRows + "</div>" : "") +
      '<button class="btn btn-primary" data-go="/item/' + item.id + '/steps">베이킹 절차 보기</button>' +
      '<button class="btn btn-secondary" data-go="/">목록으로</button>';
  }

  function bindNav() {
    root.querySelectorAll("[data-go]").forEach(function (el) {
      el.addEventListener("click", function () { go(el.getAttribute("data-go")); });
    });
  }

  function bindList() {
    bindNav();
    var add = document.getElementById("add-item");
    if (add) add.addEventListener("click", function () { go("/new"); });
    var exp = document.getElementById("export-data");
    if (exp) exp.addEventListener("click", exportData);
    var imp = document.getElementById("import-data");
    if (imp) imp.addEventListener("click", function () { document.getElementById("import-file").click(); });
    var file = document.getElementById("import-file");
    if (file) file.addEventListener("change", importData);
  }

  function bindManual(item) {
    bindNav();
    var dup = document.getElementById("duplicate");
    if (dup) dup.addEventListener("click", function () {
      var copy = cloneData(item);
      copy.id = uid();
      copy.name = item.name + " 복사";
      copy.ingredients.forEach(function (row) { row.id = uid(); });
      copy.toppings.forEach(function (row) { row.id = uid(); });
      (copy.steps || []).forEach(function (row) { row.id = uid(); });
      state.items.unshift(copy);
      saveState(state);
      go("/item/" + copy.id + "/edit");
    });
    var del = document.getElementById("delete-item");
    if (del) del.addEventListener("click", function () {
      if (!confirm("「" + item.name + "」을(를) 삭제할까요?")) return;
      state.items = state.items.filter(function (row) { return row.id !== item.id; });
      if (!state.items.length) state.items = [chestnutLoaf()];
      saveState(state);
      go("/");
    });
  }

  function readEditor(item) {
    var form = document.getElementById("edit-form");
    item.name = form.name.value.trim();
    item.pieceWeight = Number(form.pieceWeight.value);
    item.notes = form.notes.value.trim();
    item.ingredients = Array.prototype.slice.call(document.querySelectorAll("#ingredient-list .row")).map(function (row) {
      return {
        id: row.dataset.id,
        name: row.querySelector('[data-k="name"]').value.trim(),
        pct: Number(row.querySelector('[data-k="pct"]').value),
        isFlour: row.querySelector('[data-k="flour"]').checked
      };
    });
    item.toppings = Array.prototype.slice.call(document.querySelectorAll("#topping-list .row")).map(function (row) {
      return {
        id: row.dataset.id,
        name: row.querySelector('[data-k="name"]').value.trim(),
        mode: row.querySelector('[data-k="mode"]').value,
        value: Number(row.querySelector('[data-k="value"]').value)
      };
    });
    item.steps = Array.prototype.slice.call(document.querySelectorAll("#step-list .step-edit")).map(function (row) {
      return {
        id: row.dataset.id,
        title: row.querySelector('[data-k="title"]').value.trim(),
        detail: row.querySelector('[data-k="detail"]').value.trim(),
        minutes: row.querySelector('[data-k="minutes"]').value.trim()
      };
    });
  }

  function bindEditor(item) {
    bindNav();
    var addIng = document.getElementById("add-ingredient");
    if (addIng) addIng.addEventListener("click", function () {
      readEditor(item);
      item.ingredients.push({ id: uid(), name: "", pct: 0, isFlour: false });
      render();
    });
    var addTop = document.getElementById("add-topping");
    if (addTop) addTop.addEventListener("click", function () {
      readEditor(item);
      item.toppings.push({ id: uid(), name: "", mode: "bp", value: 0 });
      render();
    });
    var addStep = document.getElementById("add-step");
    if (addStep) addStep.addEventListener("click", function () {
      readEditor(item);
      item.steps = item.steps || [];
      item.steps.push(step("", "", ""));
      render();
    });
    root.querySelectorAll("[data-move]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        readEditor(item);
        var id = btn.closest("[data-id]").dataset.id;
        var from = item.steps.findIndex(function (row) { return row.id === id; });
        var to = from + Number(btn.dataset.move);
        if (from < 0 || to < 0 || to >= item.steps.length) return;
        var moved = item.steps.splice(from, 1)[0];
        item.steps.splice(to, 0, moved);
        render();
      });
    });
    root.querySelectorAll("[data-remove]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        readEditor(item);
        var id = btn.closest("[data-id]").dataset.id;
        if (btn.dataset.remove === "ingredient") {
          item.ingredients = item.ingredients.filter(function (row) { return row.id !== id; });
        } else if (btn.dataset.remove === "topping") {
          item.toppings = item.toppings.filter(function (row) { return row.id !== id; });
        } else {
          item.steps = item.steps.filter(function (row) { return row.id !== id; });
        }
        render();
      });
    });
    var form = document.getElementById("edit-form");
    if (form) form.addEventListener("submit", function (event) {
      event.preventDefault();
      readEditor(item);
      if (!item.name) { alert("품목명을 입력하세요."); return; }
      if (!item.ingredients.length) { alert("반죽 재료를 한 가지 이상 넣으세요."); return; }
      var saved = Object.assign({}, item);
      delete saved._mode;
      var index = state.items.findIndex(function (row) { return row.id === saved.id; });
      if (index >= 0) state.items[index] = saved;
      else state.items.unshift(saved);
      saveState(state);
      draft = null;
      go("/item/" + saved.id);
    });
  }

  function bindCalc(item) {
    bindNav();
    function refresh() {
      document.getElementById("count").textContent = String(pieceCount);
      document.getElementById("total").textContent = grams((Number(item.pieceWeight) || 0) * pieceCount);
    }
    var minus = document.getElementById("minus");
    if (minus) minus.addEventListener("click", function () {
      pieceCount = Math.max(1, pieceCount - 1);
      refresh();
    });
    var plus = document.getElementById("plus");
    if (plus) plus.addEventListener("click", function () {
      pieceCount += 1;
      refresh();
    });
    var toResult = document.getElementById("to-result");
    if (toResult) toResult.addEventListener("click", function () {
      go("/item/" + item.id + "/result?n=" + pieceCount);
    });
  }

  function bindSteps(item) {
    bindNav();
    if (!doneSteps[item.id]) doneSteps[item.id] = {};
    root.querySelectorAll("[data-step]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.dataset.step;
        doneSteps[item.id][id] = !doneSteps[item.id][id];
        render();
      });
    });
    var reset = document.getElementById("reset-steps");
    if (reset) reset.addEventListener("click", function () {
      doneSteps[item.id] = {};
      render();
    });
  }

  function exportData() {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "제빵-매뉴얼-배합.json";
    a.click();
    URL.revokeObjectURL(url);
  }

  function importData(event) {
    var file = event.target.files && event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(String(reader.result));
        if (!Array.isArray(parsed.items)) throw new Error("형식 오류");
        state = parsed;
        saveState(state);
        render();
      } catch (e) {
        alert("가져올 수 없는 파일입니다.");
      }
    };
    reader.readAsText(file);
    event.target.value = "";
  }

  window.addEventListener("hashchange", render);
  try { render(); }
  catch (error) {
    root.innerHTML = '<p class="lede">화면을 그리지 못했습니다.</p><p class="muted">' +
      escapeHtml(error && error.message ? error.message : String(error)) + "</p>";
  }
})();
  </script>
</body>
</html>
